# Every step runs windows\check.ps1, so `windows\check.ps1` locally checks the same things.
name: Windows

on:
  pull_request:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

# A new push to a PR cancels that PR's older run; pushes are never cancelled. The group name differs
# from ci.yml's, so the two workflows don't cancel each other.
concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned so the compiler and dotnet format don't change under us. Bump by hand, together with
  # $SdkVersion in windows/check.ps1.
  DOTNET_SDK_VERSION: 10.0.404
  # dotnet picks the newest SDK it can see. The pinned one goes into a folder of its own (see
  # DOTNET_INSTALL_DIR below), and this keeps dotnet from also looking at the preinstalled ones.
  DOTNET_MULTILEVEL_LOOKUP: 0
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # Gyan's "full" build, the one `winget install Gyan.FFmpeg` installs. The checksum is the one
  # GitHub lists for the release asset and the winget manifest for Gyan.FFmpeg 9.0.2 states.
  FFMPEG_VERSION: 9.0.2
  FFMPEG_SHA256: 759d0a9831c436a0eb331ad36f236c06cb04aaa0005da46571f0e9d3d9206f6b

defaults:
  run:
    shell: pwsh

jobs:
  format:
    name: windows-format
    # Pinned rather than windows-latest, so the image (and what's
    # preinstalled on it) only changes when we bump it.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          skip-lts-prepass: true
        env:
          # Not next to the runner's preinstalled SDKs, where a newer one would win over the pin.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
      - run: windows\check.ps1 format

  build-test-smoke:
    name: windows-build-test-smoke
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          skip-lts-prepass: true
        env:
          # Not next to the runner's preinstalled SDKs, where a newer one would win over the pin.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
      # Only ffmpeg.exe and ffprobe.exe, into a folder on PATH: the app looks for its tools on PATH
      # (Tools.Directories() in Tools.cs). LibreOffice isn't installed: it's a ~350 MB download that
      # adds minutes to every run, so the smoke test skips (and lists) the Word/ODT/RTF conversions.
      - name: Install ffmpeg
        run: |
          $ProgressPreference = "SilentlyContinue"
          $name = "ffmpeg-$env:FFMPEG_VERSION-full_build"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:FFMPEG_SHA256) { throw "$name.zip has SHA-256 $hash, expected $env:FFMPEG_SHA256" }
          $bin = Join-Path $env:RUNNER_TEMP "ffmpeg"
          New-Item -ItemType Directory -Force $bin | Out-Null
          # Windows' own tar (bsdtar) reads zip files; Git's GNU tar, which may come first on PATH, doesn't.
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $bin --strip-components 2 "$name/bin/ffmpeg.exe" "$name/bin/ffprobe.exe"
          if ($LASTEXITCODE) { throw "Couldn't extract ffmpeg from $name.zip" }
          Remove-Item $zip
          Add-Content $env:GITHUB_PATH $bin
          & (Join-Path $bin "ffmpeg.exe") -hide_banner -version | Select-Object -First 1
      - name: Build and test
        run: windows\check.ps1 build
      - name: Smoke test
        run: windows\check.ps1 smoke -NoBuild -Strict -Out "$env:RUNNER_TEMP\smoke"
      - name: Upload smoke test samples and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke-test
          path: ${{ runner.temp }}/smoke
          retention-days: 7
          if-no-files-found: ignore
