# Builds the Windows setup program (windows\build.ps1 -Setup), installs it on the runner and runs the
# smoke test against the installed app, then keeps the setup program as an artifact for a release.
#
# The setup program built here is unsigned: there is no code-signing certificate yet. It installs
# Convert, but Windows refuses to add the right-click menu entry of an unsigned package, so people
# open Convert from the Start menu and drop files on its window (see windows/README.md).
name: Windows setup

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/windows-setup.yml', 'windows/build.ps1', 'windows/installer/**']
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release on the Releases page (only after every check below has passed)"
        type: boolean
        default: false

concurrency:
  group: windows-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The same pins as windows.yml: bump them together.
  DOTNET_SDK_VERSION: 10.0.404
  DOTNET_MULTILEVEL_LOOKUP: 0
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # The installer builder. The checksum is the one GitHub lists for the release asset
  # (github.com/jrsoftware/issrc, tag is-6_7_3).
  INNO_SETUP_VERSION: 6.7.3
  INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
  # The ffmpeg bundled into the setup program: Gyan's "essentials" build, which has every encoder Convert uses
  # at half the size of the "full" one. The same pin as windows.yml; bump them together.
  FFMPEG_VERSION: 9.0.2
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    name: windows-setup
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          skip-lts-prepass: true
        env:
          # Not next to the runner's preinstalled SDKs, where a newer one would win over the pin.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
      - name: Install Inno Setup
        run: |
          $ProgressPreference = "SilentlyContinue"
          $tag = "is-" + $env:INNO_SETUP_VERSION.Replace(".", "_")
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_SETUP_VERSION.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_SETUP_VERSION.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SETUP_SHA256) { throw "innosetup-$env:INNO_SETUP_VERSION.exe has SHA-256 $hash, expected $env:INNO_SETUP_SHA256" }
          # For this user only, where build.ps1 looks first; it replaces nothing the image came with.
          $p = Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode) { throw "The Inno Setup installer ended with code $($p.ExitCode)" }
          Remove-Item $exe
          $iscc = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe isn't at $iscc after installing Inno Setup" }
      # Into windows\tools\ffmpeg, where build.ps1 picks it up and ships it in tools\ next to Convert.exe.
      # Not on PATH, so the smoke test below can only pass with the bundled copy.
      - name: Get ffmpeg to bundle
        run: |
          $ProgressPreference = "SilentlyContinue"
          $name = "ffmpeg-$env:FFMPEG_VERSION-essentials_build"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:FFMPEG_SHA256) { throw "$name.zip has SHA-256 $hash, expected $env:FFMPEG_SHA256" }
          $dest = "windows\tools\ffmpeg"
          New-Item -ItemType Directory -Force $dest | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $dest --strip-components 2 "$name/bin/ffmpeg.exe" "$name/bin/ffprobe.exe"
          if ($LASTEXITCODE) { throw "Couldn't extract ffmpeg from $name.zip" }
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $dest --strip-components 1 "$name/LICENSE"
          if ($LASTEXITCODE) { throw "Couldn't extract ffmpeg's LICENSE from $name.zip" }
          Move-Item (Join-Path $dest "LICENSE") (Join-Path $dest "FFMPEG-LICENSE.txt")
          @(
            "Convert includes ffmpeg $env:FFMPEG_VERSION (ffmpeg.exe and ffprobe.exe in this folder), the",
            "'essentials' Windows build by Gyan Doshi, licensed under the GNU General Public License version 3.",
            "Its licence is in FFMPEG-LICENSE.txt.",
            "",
            "Source code:",
            "  ffmpeg:          https://ffmpeg.org/download.html",
            "  this build:      https://github.com/GyanD/codexffmpeg/releases/tag/$env:FFMPEG_VERSION",
            "  build recipes:   https://www.gyan.dev/ffmpeg/builds/"
          ) | Set-Content (Join-Path $dest "FFMPEG-NOTICE.txt") -Encoding utf8
          if (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) {
            Write-Host "Note: an ffmpeg is also on PATH: $((Get-Command ffmpeg.exe).Source)"
          }
      - name: Build the setup program
        run: |
          windows\build.ps1 -Setup
          $setup = Get-ChildItem windows\out\Convert-*-setup.exe
          if (@($setup).Count -ne 1) { throw "Expected one setup program in windows\out, found $(@($setup).Count)" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content (Join-Path $setup.DirectoryName "$($setup.Name).sha256") -Encoding ascii
          "SETUP=$($setup.FullName)" | Add-Content $env:GITHUB_ENV
          Write-Host ("{0}: {1:N1} MB, SHA-256 {2}" -f $setup.Name, ($setup.Length / 1MB), $hash)
      # The latest release, measured on this same machine, so the numbers below compare like with like.
      # It is installed, measured and uninstalled before this build is installed.
      - name: Measure the latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "previous"
          gh release download --repo $env:GITHUB_REPOSITORY --pattern "Convert-*-setup.exe" --dir $dir
          $old = Get-ChildItem $dir -Filter "Convert-*-setup.exe" | Select-Object -First 1
          if (-not $old) { Write-Host "No release yet"; exit 0 }
          $p = Start-Process $old.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($p.ExitCode) { throw "The release's setup program ended with code $($p.ExitCode)" }
          try {
            windows\measure.ps1 -Label "Latest release ($($old.Name))" -Setup $old.FullName -Results "$env:RUNNER_TEMP\measurements.txt"
          } finally {
            $app = Join-Path $env:LOCALAPPDATA "Programs\Convert"
            $unins = Get-ChildItem $app -Filter "unins*.exe" | Select-Object -First 1
            if ($unins) { Start-Process $unins.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait }
            for ($i = 0; $i -lt 20 -and (Test-Path (Join-Path $app "Convert.exe")); $i++) { Start-Sleep -Seconds 1 }
            Remove-Item (Join-Path $env:LOCALAPPDATA "Convert") -Recurse -Force -ErrorAction SilentlyContinue
          }
      # Nobody should be the first to run a download. If the runner has no .NET Desktop Runtime of the
      # right version, this also takes the path where the setup program fetches Microsoft's installer.
      - name: Install it here
        timeout-minutes: 20
        run: |
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          $p = Start-Process $env:SETUP -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode) { Get-Content $log -Tail 60; throw "The setup program ended with code $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\Convert\Convert.exe"
          if (-not (Test-Path $app)) { Get-Content $log -Tail 60; throw "Convert.exe isn't at $app after the setup program ran" }
          Select-String -Path $log -Pattern "menu|\.NET|dotnet" -SimpleMatch:$false | Select-Object -Last 15 | ForEach-Object { $_.Line }
          $tools = Join-Path $env:LOCALAPPDATA "Programs\Convert\tools"
          foreach ($f in "ffmpeg.exe", "ffprobe.exe", "FFMPEG-LICENSE.txt", "FFMPEG-NOTICE.txt") {
            if (-not (Test-Path (Join-Path $tools $f))) { throw "$f isn't in $tools after the setup program ran" }
          }
      # The setup program is unsigned, so it adds the classic menu entry and Send to. Explorer starts
      # Convert once per selected file; the processes must gather the files into one window.
      - name: Check the classic menu entry and Send to
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Convert\Convert.exe"
          foreach ($ext in "mp4", "mp3", "jpg", "pdf", "woff2") {
            $key = "HKCU:\Software\Classes\SystemFileAssociations\.$ext\shell\Convert"
            $command = (Get-ItemProperty -LiteralPath "$key\command" -ErrorAction Stop).'(default)'
            if ($command -ne "`"$exe`" --open `"%1`"") { throw "Unexpected command for .${ext}: $command" }
            if ((Get-ItemProperty -LiteralPath $key).MultiSelectModel -ne "Player") { throw "MultiSelectModel isn't Player for .$ext" }
          }
          # Convert to ▸ (one-click formats): a submenu whose entries run --quick <format>.
          $quick = "HKCU:\Software\Classes\SystemFileAssociations\.mov\shell\ConvertTo"
          if ((Get-ItemProperty -LiteralPath $quick -ErrorAction Stop).SubCommands -ne "") { throw "ConvertTo for .mov has no SubCommands value" }
          $items = @(Get-ChildItem -LiteralPath "$quick\shell" | ForEach-Object { $_.PSChildName })
          Write-Host "Convert to (.mov): $($items -join ', ')"
          if (($items -join ",") -ne "01-mp4-h264,02-mp3,03-gif") { throw "Unexpected Convert to entries for .mov" }
          $mp3 = (Get-ItemProperty -LiteralPath "$quick\shell\02-mp3\command").'(default)'
          if ($mp3 -ne "`"$exe`" --quick mp3 `"%1`"") { throw "Unexpected quick command: $mp3" }
          $sendTo = Join-Path ([Environment]::GetFolderPath("SendTo")) "Convert.lnk"
          if (-not (Test-Path $sendTo)) { throw "No Send to shortcut at $sendTo" }
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut($sendTo)
          if ($lnk.TargetPath -ne $exe -or $lnk.Arguments -ne "--open") { throw "Send to shortcut points at '$($lnk.TargetPath) $($lnk.Arguments)'" }

          # Run the menu entry for three files the way Explorer does (through the shell, once per file).
          $dir = Join-Path $env:RUNNER_TEMP "menu"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $names = "one.mp3", "two.jpg", "three – été.pdf"
          foreach ($n in $names) { Set-Content (Join-Path $dir $n) "x" }
          $report = Join-Path $env:RUNNER_TEMP "gathered.txt"
          $env:CONVERT_OPEN_REPORT = $report
          $folder = (New-Object -ComObject Shell.Application).Namespace($dir)
          foreach ($n in $names) { $folder.ParseName($n).InvokeVerb("Convert") }
          for ($i = 0; $i -lt 30 -and -not (Test-Path $report); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 1
          if (-not (Test-Path $report)) { throw "Convert didn't write $report" }
          $gathered = @(Get-Content $report -Encoding utf8 | Sort-Object)
          $expected = @($names | ForEach-Object { Join-Path $dir $_ } | Sort-Object)
          Write-Host "Gathered: $($gathered -join ' | ')"
          if (($gathered -join "`n") -ne ($expected -join "`n")) { throw "Expected one window with all three files" }

          # Convert to ▸ MP3 for two files: started together, they gather into one conversion, apart from --open's window.
          $report = Join-Path $env:RUNNER_TEMP "quick.txt"
          $env:CONVERT_OPEN_REPORT = $report
          $a = Join-Path $dir "one.mp3"; $b = Join-Path $dir "two.jpg"
          $procs = @($a, $b) | ForEach-Object { Start-Process $exe -ArgumentList "--quick", "mp3", "`"$_`"" -PassThru }
          $procs | Wait-Process -Timeout 60
          $gathered = @(Get-Content $report -Encoding utf8 | Sort-Object)
          Write-Host "Quick gathered: $($gathered -join ' | ')"
          if (($gathered -join "`n") -ne ((@($a, $b) | Sort-Object) -join "`n")) { throw "Expected one quick conversion with both files" }
          $env:CONVERT_OPEN_REPORT = $null
      # Convert to ▸ MP3 for real, on a file on the desktop: it converts, puts the MP3 next to the
      # original and closes its window by itself. The pointer is moved out of the way first.
      - name: Quick conversion closes by itself
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Convert\Convert.exe"
          $desktop = [Environment]::GetFolderPath("Desktop")
          $wav = Join-Path $desktop "quick test.wav"
          & (Join-Path $env:LOCALAPPDATA "Programs\Convert\tools\ffmpeg.exe") -v error -f lavfi -i "sine=frequency=440:duration=1" $wav
          Add-Type -Namespace Native -Name Cursor -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          [Native.Cursor]::SetCursorPos(0, 0) | Out-Null
          $log = Join-Path $env:LOCALAPPDATA "Convert\convert.log"
          $p = Start-Process $exe -ArgumentList "--quick", "mp3", "`"$wav`"" -PassThru
          $closed = $p.WaitForExit(60000)
          if (Test-Path $log) { Get-Content $log }
          if (-not $closed) { Stop-Process -Id $p.Id -Force; throw "The quick conversion's window didn't close by itself within 60 s" }
          $mp3 = Join-Path $desktop "quick test.mp3"
          if (-not (Test-Path $mp3)) { throw "No $mp3 next to the original" }
          Remove-Item $wav, $mp3
      - name: Measure this build
        run: windows\measure.ps1 -Label "This build ($((Get-Item $env:SETUP).Name))" -Setup $env:SETUP -Results "$env:RUNNER_TEMP\measurements.txt"
      # -Strict: audio and video must work with the bundled ffmpeg. LibreOffice isn't installed, so the
      # smoke test skips (and lists) Word, ODT and RTF.
      - name: Smoke test the installed app
        run: windows\smoke-test.ps1 -Exe "$env:LOCALAPPDATA\Programs\Convert\Convert.exe" -Out "$env:RUNNER_TEMP\smoke" -Strict
      - name: Uninstall it
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Convert"
          $unins = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $unins) { throw "No uninstaller in $dir" }
          $p = Start-Process $unins.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode) { throw "The uninstaller ended with code $($p.ExitCode)" }
          # The uninstaller removes what's left of the folder a moment after it exits.
          for ($i = 0; $i -lt 20 -and (Test-Path (Join-Path $dir "Convert.exe")); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir "Convert.exe")) { throw "Convert.exe is still in $dir after uninstalling" }
          if (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\.mp4\shell\Convert") { throw "The classic menu entry is still there" }
          if (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\.mov\shell\ConvertTo") { throw "The Convert to submenu is still there" }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath("SendTo")) "Convert.lnk")) { throw "The Send to shortcut is still there" }
      - name: Keep the setup program
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: convert-windows-setup
          path: |
            windows/out/Convert-*-setup.exe
            windows/out/Convert-*-setup.exe.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Measurements
        if: always()
        run: if (Test-Path "$env:RUNNER_TEMP\measurements.txt") { Get-Content "$env:RUNNER_TEMP\measurements.txt" }
      - name: Upload the setup and smoke test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup-logs
          path: |
            ${{ runner.temp }}/setup.log
            ${{ runner.temp }}/smoke
          retention-days: 7
          if-no-files-found: ignore

  # Run from the Actions tab with "release" ticked: publishes the tested setup program as a release named
  # after the version in windows/Directory.Build.props, with the notes in windows/installer/release-notes.md.
  release:
    name: publish-release
    needs: setup
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to create the release
      actions: read     # to fetch the setup program the job above kept
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name convert-windows-setup --dir dist
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' windows/Directory.Build.props)
          ls -l dist
          test -f "dist/Convert-$version-setup.exe" || { echo "No dist/Convert-$version-setup.exe"; exit 1; }
          gh release create "v$version" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Convert for Windows $version" --notes-file windows/installer/release-notes.md
