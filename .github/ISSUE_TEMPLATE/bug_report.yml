name: Something broke
description: A conversion failed, gave a wrong result, or the app misbehaved.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The more exact you are, the faster this gets fixed.
        Found a security problem? Please don't report it here; see the [security policy](https://github.com/Tod913/convert-windows/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you get instead? Copy any error message the window showed.
      placeholder: I converted a 2-hour MKV to MP4 (HEVC). The bar reached about half, then the window said…
    validations:
      required: true
  - type: input
    id: from-to
    attributes:
      label: From which format to which?
      placeholder: opus → mp3
    validations:
      required: true
  - type: input
    id: convert-version
    attributes:
      label: Convert version
      description: Settings → Apps → Installed apps, next to Convert.
      placeholder: "0.4"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Start → Settings → System → About, under "Windows specifications".
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: opened-from
    attributes:
      label: How did you start the conversion?
      options:
        - Right-click → Convert to ▸ (a format)
        - Right-click → Convert…
        - Send to → Convert
        - Dragged the file onto the window
        - Command line (--cli)
    validations:
      required: false
  - type: input
    id: tools
    attributes:
      label: LibreOffice installed? (for Word, ODT and RTF)
      description: Only for document conversions. Leave empty otherwise.
    validations:
      required: false
  - type: textarea
    id: file
    attributes:
      label: The file
      description: If the file isn't private, drag it in here (zip it first if GitHub refuses the type). A file that fails is the fastest way to a fix. Otherwise, describe it (size, length, where it came from).
    validations:
      required: false
